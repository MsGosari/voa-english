name: Fetch VOA News Daily

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch VOA RSS and Save to JSON
        run: |
          python -c "
          import urllib.request
          import xml.etree.ElementTree as ET
          import json
          import re

          url = 'https://learningenglish.voanews.com/api/z-m_qvy5-it'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})

          try:
              html = urllib.request.urlopen(req).read()
              root = ET.fromstring(html)
              articles = []
              
              for item in root.findall('.//item'):
                  title = item.find('title').text if item.find('title') is not None else ''
                  desc = item.find('description').text if item.find('description') is not None else ''
                  clean_desc = re.sub('<[^<]+?>', '', desc).strip()
                  if title and clean_desc:
                      articles.append({'title': title, 'content': clean_desc})
              
              with open('news.json', 'w', encoding='utf-8') as f:
                  json.dump(articles[:10], f, ensure_ascii=False, indent=2)
              print('Successfully created news.json')
          except Exception as e:
              print(f'Error fetching RSS: {e}')
          "

      - name: Commit and Push news.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add news.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto update VOA news"
          git push
