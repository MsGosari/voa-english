<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <title>VOA 미국 영어 학습기</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 15px; background: #f8f9fa; color: #333; }
    h2 { font-size: 1.2rem; margin-top: 0; color: #003366; }
    h3 { font-size: 0.95rem; margin-bottom: 8px; color: #555; }
    
    /* 뉴스 선택 영역 */
    .news-select-box { background: #fff; padding: 12px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 15px; }
    select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.9rem; background: #fff; margin-bottom: 8px; }
    
    .transcript-box { height: 280px; overflow-y: auto; background: #fff; border: 1px solid #e0e0e0; padding: 15px; line-height: 1.8; border-radius: 8px; font-size: 0.95rem; }
    .word-token { cursor: pointer; padding: 2px 3px; border-radius: 4px; display: inline; transition: background 0.15s; }
    .word-token:hover, .word-token:active { background-color: #ffe066; }
    
    /* 단어장 영역 */
    .vocab-section { margin-top: 15px; background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #e0e0e0; }
    .word-chip { display: inline-block; background: #e9ecef; color: #495057; padding: 5px 10px; margin: 4px; border-radius: 15px; font-size: 0.85rem; font-weight: 500; }
    .btn-export { width: 100%; padding: 12px; background: #28a745; color: #fff; border: none; border-radius: 6px; font-weight: bold; font-size: 0.95rem; margin-top: 10px; cursor: pointer; }
  </style>
</head>
<body>

  <h2>🇺🇸 VOA Daily English Learner</h2>

  <!-- 자동 불러온 뉴스 선택 목록 -->
  <div class="news-select-box">
    <h3>📰 오늘의 VOA 최신 기사 선택</h3>
    <select id="newsSelect" onchange="loadSelectedNews()">
      <option value="">뉴스 목록을 불러오는 중...</option>
    </select>
  </div>

  <!-- 선택한 뉴스 스크립트 출력 화면 -->
  <h3>📜 스크립트 (단어를 터치하세요)</h3>
  <div class="transcript-box" id="transcript">
    <span style="color: #999;">위 목록에서 뉴스를 선택하면 스크립트가 자동으로 로드됩니다.</span>
  </div>

  <!-- 단어장 영역 -->
  <div class="vocab-section">
    <h3>📚 오늘의 단어장</h3>
    <div id="wordList" style="min-height: 35px; color: #888; font-size: 0.85rem;">터치한 단어가 여기에 표시됩니다.</div>
    <button class="btn-export" onclick="exportToGoogleDocs()">Google Docs로 내보내기</button>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js'); });
    }

    let newsArticles = [];
    const savedWords = new Set();

    // VOA RSS 피드를 가져와 드롭다운에 목록 자동 생성
    async function fetchVOANews() {
      const rssUrl = 'https://learningenglish.voanews.com/api/z-$m_qvy5-it';
      const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;

      try {
        const response = await fetch(apiUrl);
        const data = await response.json();
        
        if (data.status === 'ok') {
          newsArticles = data.items;
          const selectEl = document.getElementById('newsSelect');
          selectEl.innerHTML = '<option value="">-- 읽고 싶은 뉴스를 선택하세요 --</option>';
          
          newsArticles.forEach((item, index) => {
            const option = document.createElement('option');
            option.value = index;
            option.innerText = item.title;
            selectEl.appendChild(option);
          });
        }
      } catch (error) {
        document.getElementById('newsSelect').innerHTML = '<option value="">뉴스를 불러오지 못했습니다.</option>';
      }
    }

    // 선택한 뉴스의 본문을 스크립트로 변환
    function loadSelectedNews() {
      const index = document.getElementById('newsSelect').value;
      const container = document.getElementById('transcript');

      if (index === "") {
        container.innerHTML = '<span style="color: #999;">위 목록에서 뉴스를 선택하면 스크립트가 자동으로 로드됩니다.</span>';
        return;
      }

      const selected = newsArticles[index];
      // HTML 태그 제거 및 순수 텍스트 추출
      const cleanText = selected.content.replace(/<[^>]*>?/gm, '').trim();
      const words = cleanText.split(/\s+/);

      container.innerHTML = words.map(word => {
        const cleanWord = word.replace(/[^a-zA-Z]/g, "");
        return `<span class="word-token" data-word="${cleanWord}">${word}</span>`;
      }).join(' ');
    }

    // 단어 터치 이벤트
    document.getElementById('transcript').addEventListener('click', (e) => {
      if (e.target.classList.contains('word-token')) {
        const word = e.target.getAttribute('data-word').toLowerCase();
        if (word && word.length > 1) {
          savedWords.add(word);
          renderWordList();
        }
      }
    });

    function renderWordList() {
      const listContainer = document.getElementById('wordList');
      if (savedWords.size === 0) {
        listContainer.innerHTML = "터치한 단어가 여기에 표시됩니다.";
        return;
      }
      listContainer.innerHTML = Array.from(savedWords).map(w => `<span class="word-chip">${w}</span>`).join('');
    }

    function exportToGoogleDocs() {
      if (savedWords.size === 0) {
        alert("선택된 단어가 없습니다!");
        return;
      }
      alert("Google Docs 전송 단어 목록:\n" + Array.from(savedWords).join(', '));
    }

    // 페이지 로드 시 뉴스 자동 호출
    window.onload = fetchVOANews;
  </script>
</body>
</html>
